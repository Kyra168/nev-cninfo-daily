name: NEV 每日巨潮公告入库

on:
  schedule:
    # 09:00 UTC = 17:00 Asia/Shanghai, every calendar day.
    - cron: '0 9 * * *'
  workflow_dispatch:
  # Verify deployment immediately when collector/configuration code is uploaded.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cninfo-daily.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'precrawler/companies.json'
      - 'seed/nev_stock.db.gz'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: nev-cninfo-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: 获取抓取程序与初始数据库
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 记录云端任务开始时间
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/record_run.py --stage started
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖并运行离线校验
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -v
      - name: 恢复上次云端数据库
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/state_store.py restore
      - name: 抓取20家公司巨潮公告并写入数据库
        id: collect
        continue-on-error: true
        run: python scripts/collect_cninfo.py --db data/nev_stock.db --companies precrawler/companies.json --summary data/last_run.json
      - name: 生成本次数据库快照
        id: bundle
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.collect.outcome != 'skipped' }}
        run: python scripts/state_store.py bundle
      - name: 将快照持久保存到私有仓库
        id: publish
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/state_store.py publish
      - name: 保存运行记录及备用快照（7天）
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: nev-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/nev-data.zip
            data/last_run.json
          retention-days: 7
          if-no-files-found: error
      - name: 保存可查询的云端运行状态
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: python3 scripts/record_run.py --stage finished
      - name: 汇总执行结果
        if: ${{ always() }}
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('data/last_run.json')
          text = p.read_text(encoding='utf-8') if p.exists() else '本次未生成抓取记录，请查看前面失败的步骤。'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## 20家公司每日巨潮公告入库\n\n```json\n' + text + '\n```\n')
          if os.environ['COLLECTION_OUTCOME'] != 'success' or os.environ['PUBLISH_OUTCOME'] != 'success':
              raise SystemExit('抓取或数据库持久保存未全部成功；任务标记失败，请检查各公司状态。')
          PY
